<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Raju Prasad Pradhan | Gram Panchayat Panduwa</title>
<style>
:root {
  --bg:#f4f6fb;
  --card:#fff;
  --ink:#14213d;
  --mut:#657086;
  --line:#dfe3ee;
  --accent:#f5a623;
  --green:#087e70;
}
[data-theme="dark"] {
  --bg:#101a2d;
  --card:#192641;
  --ink:#fff;
  --mut:#aab5ca;
  --line:#30405f;
}
*{box-sizing:border-box}
body{
 margin:0;
 background:var(--bg);
 color:var(--ink);
 font-family:Arial,sans-serif;
 padding-bottom:80px;
}
header{
 background:linear-gradient(135deg,#087e70,#2563eb);
 color:white;
 padding:17px 14px 10px;
}
.wrap{max-width:760px;margin:auto;padding:0 14px}
header b{font-size:21px}
.sub{font-size:12px}
.top{
 display:flex;
 gap:7px;
 overflow:auto;
 padding:12px 0 4px;
}
.top a{
 color:white;
 text-decoration:none;
 background:#ffffff30;
 border-radius:30px;
 padding:8px 13px;
 white-space:nowrap;
 font-size:13px;
}
.top a.on{background:white;color:#087e70}
main{padding-top:15px}
h1{font-size:23px}
h2{font-size:19px;margin-top:20px}
h3{font-size:16px}
.card{
 background:var(--card);
 border:1px solid var(--line);
 border-radius:14px;
 padding:14px;
 margin-bottom:12px;
}
.hero{
 background:linear-gradient(135deg,#087e70,#2563eb);
 color:white;
 border-radius:16px;
 padding:20px;
}
input,textarea,select{
 display:block;
 width:100%;
 padding:12px;
 margin:6px 0 12px;
 border:1px solid var(--line);
 border-radius:9px;
 background:var(--bg);
 color:var(--ink);
 font-size:15px;
}
textarea{min-height:90px}
label{font-size:13px;color:var(--mut)}
button,.btn{
 border:0;
 padding:11px 16px;
 border-radius:9px;
 background:var(--accent);
 color:#14213d;
 font-weight:bold;
 cursor:pointer;
 text-decoration:none;
 display:inline-block;
}
.btn.alt{background:var(--bg);color:var(--ink);border:1px solid var(--line)}
.btn.red{background:#ffe5e5;color:#b91c1c}
.note{font-size:12px;color:var(--mut)}
.err{color:#d22}
.chip{background:#ffdf8b;padding:3px 9px;border-radius:20px;font-size:11px}
.tabs{display:flex;gap:7px;margin-bottom:10px}
.tabs button{flex:1}
.tabs button.on{background:#087e70;color:white}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.grid img{width:100%;height:130px;object-fit:cover;border-radius:10px}
.bot{
 position:fixed;
 bottom:0;left:0;right:0;
 display:flex;
 background:var(--card);
 border-top:1px solid var(--line);
 padding-bottom:env(safe-area-inset-bottom);
 z-index:5;
}
.bot a{
 flex:1;
 text-align:center;
 padding:8px 2px;
 color:var(--mut);
 text-decoration:none;
 font-size:11px;
}
.bot span{display:block;font-size:20px}
.bot a.on{color:#087e70;font-weight:bold}
.stat{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat div{background:linear-gradient(135deg,#087e70,#2563eb);color:white;text-align:center;padding:15px;border-radius:12px}
.stat b{display:block;font-size:23px}
.li{padding:10px 0;border-bottom:1px solid var(--line)}
#toast{
 display:none;
 position:fixed;
 bottom:90px;
 left:50%;
 transform:translateX(-50%);
 background:#14213d;
 color:white;
 padding:12px 18px;
 border-radius:10px;
 z-index:10;
}
footer{padding:15px 0;font-size:12px;color:var(--mut)}
footer a{color:var(--green)}
.hide{display:none}
@media(min-width:600px){
 .grid{grid-template-columns:repeat(3,1fr)}
}
</style>
</head>
<body>

<header>
 <div class="wrap">
  <b>Raju Prasad Pradhan</b>
  <div class="sub">Gram Panchayat Panduwa, Bara, Prayagraj, Uttar Pradesh</div>
  <nav class="top" id="top"></nav>
 </div>
</header>

<main class="wrap" id="app">
 <p>लोड हो रहा है...</p>
</main>

<footer class="wrap">
 यह एक कम्युनिटी वेबसाइट है, आधिकारिक सरकारी वेबसाइट नहीं।
 <br>
 <a href="#privacy">गोपनीयता</a> |
 <a href="#terms">नियम एवं शर्तें</a>
</footer>

<nav class="bot" id="bot"></nav>
<div id="toast"></div>

<script>
const $ = s => document.querySelector(s);

let ME = null;
let LANG = localStorage.getItem("lang") || "hi";
let THEME = localStorage.getItem("theme") || "";
let PAGE = 1;
let TYPE = "news";
let SEARCH = "";

const words = {
 hi:{
 home:"होम",about:"हमारे बारे में",services:"सेवाएं",
 dev:"विकास कार्य",news:"समाचार",notice:"सूचनाएं",
 gallery:"गैलरी",contact:"शिकायत",account:"प्रोफाइल",
 settings:"सेटिंग्स",admin:"एडमिन",login:"लॉगिन",
 register:"रजिस्टर",logout:"लॉगआउट",name:"नाम",
 email:"ईमेल",password:"पासवर्ड",mobile:"मोबाइल नंबर",
 subject:"विषय",details:"शिकायत का विवरण",
 send:"शिकायत भेजें",save:"सेव करें",search:"खोजें",
 none:"अभी कोई जानकारी उपलब्ध नहीं है।",
 welcome:"ग्राम पंचायत पंडुवा में आपका स्वागत है",
 intro:"गांव की जानकारी, समाचार, सूचनाएं और शिकायत सुविधा।",
 mycomp:"मेरी शिकायतें",oldpass:"पुराना पासवर्ड",
 newpass:"नया पासवर्ड",add:"जोड़ें",del:"हटाएं",
 title:"शीर्षक",titlehi:"हिंदी शीर्षक",body:"विवरण",
 bodyhi:"हिंदी विवरण",status:"स्थिति",img:"फोटो URL",
 cap:"फोटो कैप्शन",users:"यूज़र",comps:"शिकायतें",
 total:"कुल शिकायतें",pending:"लंबित",
 in_progress:"प्रक्रिया में",resolved:"हल हुई",
 ongoing:"जारी",completed:"पूर्ण",type:"प्रकार",
 lang:"भाषा",theme:"थीम",light:"लाइट",dark:"डार्क",
 auto:"ऑटो",done:"हो गया",project:"परियोजना"
 },
 en:{
 home:"Home",about:"About",services:"Services",
 dev:"Development",news:"News",notice:"Notices",
 gallery:"Gallery",contact:"Complaint",account:"Profile",
 settings:"Settings",admin:"Admin",login:"Login",
 register:"Register",logout:"Logout",name:"Name",
 email:"Email",password:"Password",mobile:"Mobile",
 subject:"Subject",details:"Details",send:"Submit Complaint",
 save:"Save",search:"Search",none:"Nothing available yet.",
 welcome:"Welcome to Gram Panchayat Panduwa",
 intro:"Village information, news, notices and complaints.",
 mycomp:"My Complaints",oldpass:"Old Password",
 newpass:"New Password",add:"Add",del:"Delete",
 title:"Title",titlehi:"Hindi Title",body:"Description",
 bodyhi:"Hindi Description",status:"Status",img:"Photo URL",
 cap:"Photo Caption",users:"Users",comps:"Complaints",
 total:"Total Complaints",pending:"Pending",
 in_progress:"In progress",resolved:"Resolved",
 ongoing:"Ongoing",completed:"Completed",type:"Type",
 lang:"Language",theme:"Theme",light:"Light",dark:"Dark",
 auto:"Auto",done:"Done",project:"Project"
 }
};

function t(k){return words[LANG][k] || words.en[k] || k}

function toast(msg){
 const el=$("#toast");
 el.textContent=msg;
 el.style.display="block";
 clearTimeout(window.toastTimer);
 window.toastTimer=setTimeout(()=>el.style.display="none",2500);
}

function esc(v){
 return String(v ?? "").replace(/[&<>"']/g,c=>({
 "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
 })[c]);
}

async function api(url,method="GET",data){
 const options={
  method,
  credentials:"same-origin",
  headers:{"Content-Type":"application/json"}
 };
 if(data) options.body=JSON.stringify(data);

 const response=await fetch(url,options);
 const result=await response.json();

 if(!response.ok) throw new Error(result.error || "Error");
 return result;
}

function field(name,label,type="text",required=true){
 return `
 <label>${t(label)}</label>
 <input name="${name}" type="${type}" ${required?"required":""}>
 `;
}

function card(p){
 const title=LANG==="hi" && p.title_hi ? p.title_hi : p.title;
 const body=LANG==="hi" && p.body_hi ? p.body_hi : p.body;

 return `
 <article class="card">
 ${p.image_url?`<img src="${esc(p.image_url)}" style="width:100%;border-radius:10px" alt="">`:""}
 <h3>${esc(title)}</h3>
 ${p.status?`<span class="chip">${esc(t(p.status))}</span>`:""}
 <p>${esc(body)}</p>
 <small class="note">${new Date(p.created_at).toLocaleDateString("hi-IN")}</small>
 </article>
 `;
}

function list(items){
 return items.length ? items.map(card).join("") :
 `<p class="note">${t("none")}</p>`;
}

function pager(more){
 return `
 <div class="tabs">
 <button class="btn alt" data-action="prev" ${PAGE===1?"disabled":""}>←</button>
 <button class="btn alt">${PAGE}</button>
 <button class="btn alt" data-action="next" ${!more?"disabled":""}>→</button>
 </div>
 `;
}

const pages={

home:async()=>{
 const [a,b]=await Promise.all([
  api("/api/posts?type=news"),
  api("/api/posts?type=notice")
 ]);

 return `
 <section class="hero">
 <h1>${t("welcome")}</h1>
 <p>${t("intro")}</p>
 </section>
 <h2>${t("news")}</h2>
 ${list(a.items.slice(0,3))}
 <h2>${t("notice")}</h2>
 ${list(b.items.slice(0,3))}
 <div class="card note">यह सैंपल वेबसाइट है। वास्तविक जानकारी एडमिन द्वारा अपडेट की जा सकती है।</div>
 `;
},

about:async()=>`
 <h2>${t("about")}</h2>
 <div class="card">
 <h3>Raju Prasad Pradhan</h3>
 <p>Gram Panchayat Panduwa, Bara, Prayagraj, Uttar Pradesh.</p>
 <p class="note">यह जानकारी वेबसाइट संचालक द्वारा अपडेट की जा सकती है।</p>
 </div>
`,

services:async()=>`
 <h2>${t("services")}</h2>
 <div class="card">
 <h3>जन शिकायत</h3>
 <p>गांव की समस्याओं और सार्वजनिक सुविधाओं से जुड़ी शिकायत भेजें।</p>
 <a class="btn" href="#contact">शिकायत भेजें</a>
 </div>
 <div class="card">
 <h3>सामान्य जानकारी</h3>
 <p>ग्राम पंचायत से संबंधित उपयोगी जानकारी यहां प्रकाशित की जाएगी।</p>
 </div>
`,

dev:async()=>{
 const r=await api("/api/posts?type=project&page="+PAGE);
 return `<h2>${t("dev")}</h2>${list(r.items)}${pager(r.more)}`;
},

news:async()=>{
 const r=await api(
  "/api/posts?type="+TYPE+"&page="+PAGE+"&q="+encodeURIComponent(SEARCH)
 );

 return `
 <h2>${t("news")} / ${t("notice")}</h2>
 <div class="tabs">
 <button data-action="tab" data-value="news" class="${TYPE==="news"?"on":""}">${t("news")}</button>
 <button data-action="tab" data-value="notice" class="${TYPE==="notice"?"on":""}">${t("notice")}</button>
 </div>
 <form data-form="search">
 <input name="q" placeholder="${t("search")}" value="${esc(SEARCH)}">
 <button class="btn">${t("search")}</button>
 </form>
 ${list(r.items)}
 ${pager(r.more)}
 `;
},

gallery:async()=>{
 const r=await api("/api/gallery");

 return `
 <h2>${t("gallery")}</h2>
 ${r.items.length?`
 <div class="grid">
 ${r.items.map(g=>`
 <div>
 <img src="${esc(g.url)}" alt="${esc(g.caption)}">
 <div class="note">${esc(g.caption)}</div>
 </div>
 `).join("")}
 </div>`:`<p>${t("none")}</p>`}
 `;
},

contact:async()=>`
 <h2>${t("contact")}</h2>
 <form class="card" data-form="complaint">
 ${field("name","name")}
 ${field("mobile","mobile","tel")}
 ${field("subject","subject")}
 <label>${t("details")}</label>
 <textarea name="details" required></textarea>
 <button class="btn">${t("send")}</button>
 </form>
 <div class="card">Gram Panchayat Panduwa, Bara, Prayagraj, Uttar Pradesh.</div>
`,

account:async()=>{
 if(!ME){
  return `
  <h2>${t("login")}</h2>
  <form class="card" data-form="login">
  ${field("email","email","email")}
  ${field("password","password","password")}
  <button class="btn">${t("login")}</button>
  </form>

  <h2>${t("register")}</h2>
  <form class="card" data-form="register">
  ${field("name","name")}
  ${field("email","email","email")}
  ${field("password","password","password")}
  <button class="btn">${t("register")}</button>
  </form>
  `;
 }

 const r=await api("/api/complaints/mine");

 return `
 <h2>${t("account")}</h2>
 <div class="card">
 <h3>${esc(ME.name)}</h3>
 <p>${esc(ME.email)}</p>
 <p>${ME.role==="admin"?"Admin": "User"}</p>
 </div>

 <form class="card" data-form="name">
 <label>${t("name")}</label>
 <input name="name" value="${esc(ME.name)}" required>
 <button class="btn">${t("save")}</button>
 </form>

 <form class="card" data-form="password">
 ${field("oldpass","oldpass","password")}
 ${field("newpass","newpass","password")}
 <button class="btn">${t("save")}</button>
 </form>

 <h2>${t("mycomp")}</h2>
 <div class="card">
 ${r.items.length?r.items.map(c=>`
 <div class="li">
 <b>${esc(c.subject)}</b>
 <span class="chip">${esc(t(c.status))}</span>
 <p class="note">${esc(c.details)}</p>
 </div>
 `).join(""):t("none")}
 </div>

 ${ME.role==="admin"?'<a class="btn" href="#admin">Admin Dashboard</a>':""}
 <p><button class="btn alt" data-action="logout">${t("logout")}</button></p>
 `;
},

settings:async()=>`
 <h2>${t("settings")}</h2>
 <div class="card">
 <label>${t("lang")}</label>
 <div class="tabs">
 <button data-action="lang" data-value="hi">हिंदी</button>
 <button data-action="lang" data-value="en">English</button>
 </div>

 <label>${t("theme")}</label>
 <div class="tabs">
 <button data-action="theme" data-value="">${t("auto")}</button>
 <button data-action="theme" data-value="light">${t("light")}</button>
 <button data-action="theme" data-value="dark">${t("dark")}</button>
 </div>
 </div>
`,

privacy:async()=>`
 <h2>गोपनीयता नीति</h2>
 <div class="card">
 वेबसाइट पर दी गई जानकारी का उपयोग शिकायत और अकाउंट सेवाओं के लिए किया जाता है।
 </div>
`,

terms:async()=>`
 <h2>नियम एवं शर्तें</h2>
 <div class="card">
 यह एक कम्युनिटी वेबसाइट है, आधिकारिक सरकारी वेबसाइट नहीं।
 </div>
`,

admin:async()=>{
 if(!ME || ME.role!=="admin"){
  return `<p class="err">Admin login जरूरी है। <a href="#account">Login</a></p>`;
 }

 const [stats,complaints,users,posts,gallery]=await Promise.all([
  api("/api/admin/stats"),
  api("/api/admin/complaints"),
  api("/api/admin/users"),
  api("/api/posts?page=1"),
  api("/api/gallery")
 ]);

 return `
 <h2>Admin Dashboard</h2>

 <div class="stat">
 <div><b>${stats.users}</b>${t("users")}</div>
 <div><b>${stats.total}</b>${t("total")}</div>
 <div><b>${stats.pending}</b>${t("pending")}</div>
 <div><b>${stats.resolved}</b>${t("resolved")}</div>
 </div>

 <h2>नई पोस्ट जोड़ें</h2>
 <form class="card" data-form="post">
 <label>${t("type")}</label>
 <select name="type">
 <option value="news">News</option>
 <option value="notice">Notice</option>
 <option value="project">Project</option>
 </select>

 ${field("title","title")}
 ${field("title_hi","titlehi")}
 <label>${t("body")}</label><textarea name="body"></textarea>
 <label>${t("bodyhi")}</label><textarea name="body_hi"></textarea>

 <label>${t("status")}</label>
 <select name="status">
 <option value="">-</option>
 <option value="ongoing">Ongoing</option>
 <option value="completed">Completed</option>
 </select>

 ${field("image_url","img","url",false)}
 <button class="btn">${t("add")}</button>
 </form>

 <h2>पोस्ट प्रबंधन</h2>
 <div class="card">
 ${posts.items.map(p=>`
 <div class="li">
 ${esc(p.title)}
 <button class="btn red" data-action="deletePost" data-id="${p.id}">हटाएं</button>
 </div>
 `).join("")}
 </div>

 <h2>Gallery में फोटो जोड़ें</h2>
 <form class="card" data-form="pic">
 ${field("url","img","url")}
 ${field("caption","cap", "text",false)}
 <button class="btn">${t("add")}</button>
 </form>

 <div class="card">
 ${gallery.items.map(g=>`
 <div class="li">
 ${esc(g.caption || g.url)}
 <button class="btn red" data-action="deletePic" data-id="${g.id}">हटाएं</button>
 </div>
 `).join("")}
 </div>

 <h2>शिकायत प्रबंधन</h2>
 <div class="card">
 ${complaints.items.map(c=>`
 <div class="li">
 <b>${esc(c.subject)}</b>
 <p>${esc(c.name)} | ${esc(c.mobile)}</p>
 <p>${esc(c.details)}</p>
 <select data-action="status" data-id="${c.id}">
 ${["pending","in_progress","resolved"].map(s=>
 `<option value="${s}" ${s===c.status?"selected":""}>${t(s)}</option>`
 ).join("")}
 </select>
 </div>
 `).join("")}
 </div>

 <h2>यूज़र प्रबंधन</h2>
 <div class="card">
 ${users.items.map(u=>`
 <div class="li">
 <b>${esc(u.name)}</b>
 <p class="note">${esc(u.email)} | ${esc(u.role)}</p>
 ${u.id!==ME.id?`<button class="btn red" data-action="deleteUser" data-id="${u.id}">हटाएं</button>`:""}
 </div>
 `).join("")}
 </div>
 `;
}
};

const nav=[
 "home","about","services","dev","news","gallery","contact",
 "privacy","terms"
];

const bottom=[
 ["home","⌂"],["services","☷"],["gallery","▧"],
 ["account","☺"],["settings","⚙"]
];

async function load(){
 let page=(location.hash||"#home").slice(1);
 if(!pages[page])page="home";

 const all=nav.concat(ME?.role==="admin"?["admin"]:[]);

 $("#top").innerHTML=all.map(k=>
 `<a href="#${k}" class="${k===page?"on":""}">${t(k)}</a>`
 ).join("");

 $("#bot").innerHTML=bottom.map(x=>
 `<a href="#${x[0]}" class="${x[0]===page?"on":""}">
 <span>${x[1]}</span>${t(x[0])}</a>`
 ).join("");

 $("#app").innerHTML="<p>लोड हो रहा है...</p>";

 try{
  $("#app").innerHTML=await pages[page]();
  window.scrollTo(0,0);
 }catch(e){
  $("#app").innerHTML=`<div class="card err">${esc(e.message)}
  <p>कृपया इंटरनेट या सर्वर कनेक्शन चेक करें।</p></div>`;
 }
}

function formData(form){
 return Object.fromEntries(new FormData(form).entries());
}

document.addEventListener("click",async e=>{
 const b=e.target.closest("[data-action]");
 if(!b)return;

 const action=b.dataset.action;
 const id=b.dataset.id;

 try{
  if(action==="logout"){
   await api("/api/auth/logout","POST");
   ME=null;
   location.hash="#home";
   await load();
  }

  if(action==="lang"){
   LANG=b.dataset.value;
   localStorage.setItem("lang",LANG);
   load();
  }

  if(action==="theme"){
   THEME=b.dataset.value;
   localStorage.setItem("theme",THEME);
   document.documentElement.dataset.theme=THEME;
   load();
  }

  if(action==="tab"){
   TYPE=b.dataset.value;
   PAGE=1;
   load();
  }

  if(action==="prev"){
   PAGE=Math.max(1,PAGE-1);
   load();
  }

  if(action==="next"){
   PAGE++;
   load();
  }

  if(action==="deletePost" && confirm("क्या पोस्ट हटानी है?")){
   await api("/api/admin/posts/"+id,"DELETE");
   toast("पोस्ट हट गई");
   load();
  }

  if(action==="deletePic" && confirm("क्या फोटो हटानी है?")){
   await api("/api/admin/gallery/"+id,"DELETE");
   toast("फोटो हट गई");
   load();
  }

  if(action==="deleteUser" && confirm("क्या यूज़र हटाना है?")){
   await api("/api/admin/users/"+id,"DELETE");
   toast("यूज़र हट गया");
   load();
  }
 }catch(err){
  toast(err.message);
 }
});

document.addEventListener("change",async e=>{
 const el=e.target;
 if(el.dataset.action==="status"){
  try{
   await api("/api/admin/complaints/"+el.dataset.id,"PUT",{status:el.value});
   toast("शिकायत की स्थिति अपडेट हुई");
  }catch(err){toast(err.message)}
 }
});

document.addEventListener("submit",async e=>{
 const form=e.target;
 if(!form.dataset.form)return;

 e.preventDefault();
 const type=form.dataset.form;
 const data=formData(form);

 try{
  if(type==="login"){
   const r=await api("/api/auth/login","POST",data);
   ME=r.user;
   toast("लॉगिन सफल");
   location.hash="#account";
   load();
  }

  if(type==="register"){
   const r=await api("/api/auth/register","POST",data);
   ME=r.user;
   toast("रजिस्ट्रेशन सफल");
   location.hash="#account";
   load();
  }

  if(type==="complaint"){
   await api("/api/complaints","POST",data);
   form.reset();
   toast("शिकायत भेज दी गई");
  }

  if(type==="name"){
   const r=await api("/api/me","PUT",data);
   ME=r.user;
   toast("नाम अपडेट हुआ");
   load();
  }

  if(type==="password"){
   await api("/api/me/password","PUT",data);
   form.reset();
   toast("पासवर्ड बदल गया");
  }

  if(type==="search"){
   SEARCH=data.q || "";
   PAGE=1;
   load();
  }

  if(type==="post"){
   await api("/api/admin/posts","POST",data);
   form.reset();
   toast("पोस्ट जोड़ दी गई");
   load();
  }

  if(type==="pic"){
   await api("/api/admin/gallery","POST",data);
   form.reset();
   toast("फोटो जोड़ दी गई");
   load();
  }

 }catch(err){
  toast(err.message);
 }
});

window.addEventListener("hashchange",()=>{
 PAGE=1;
 load();
});

async function start(){
 document.documentElement.dataset.theme=THEME;

 try{
  const r=await api("/api/me");
  ME=r.user;
 }catch{
  ME=null;
 }

 load();
}

start();
</script>
</body>
</html>
